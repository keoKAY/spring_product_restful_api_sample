services:
  product-api:
    image: username/image-name/tag
    container_name: product-api
    restart: always
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
#      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
#      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    labels:
      - traefik.enable=true
      # HTTPS
    # we will hide the domain name later
      - traefik.http.routers.product.rule=Host(`ite-spring.anajak-khmer.site`)
      - traefik.http.routers.product.entrypoints=websecure
      - traefik.http.routers.product.tls.certresolver=myresolver
      - traefik.http.services.product.loadbalancer.server.port=8080

    networks:
      - proxy_net
networks:
  proxy_net:
    name: preparations_proxy_net
    external: true