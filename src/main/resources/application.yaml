
# configuration to enable the user creations inside the keycloak
keycloak:
    server-url: http://localhost:9999
    realm: ecommerce_realm
    client-secret: bK6I3SHJV3qgBsxv7wB3KyEamlcDwiO8
    client-id: spring-boot-app


file:
    client-path: /files
    storage-location: /Users/kk/Engineering/ite-images/
    base-url: http://localhost:${server.port}${file.client-path}/
# http://localhost:8080/files/
spring:
    security:
      oauth2:
        client:
          registration:
            keycloak:
              client-id: "spring-boot-app"
              client-secret: "bK6I3SHJV3qgBsxv7wB3KyEamlcDwiO8"
              scope: openid, profile, email, offline_access
              authorization-grant-type: authorization_code
              redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          provider:
            keycloak:
              # change your actual keycloak host port and realm name
              issuer-uri: ${keycloak.server-url}/realms/${keycloak.realm}

# http://localhost:9999/realms/ecommerce_realm/protocol/openid-connect/auth?response_type=code&client_id=spring-boot-app&scope=openid%20profile%20email%20offline_access&state=pXQagQzskqEuZNN9jh8SqIk9PH2plL9Q0Pykv0cvMi8%3D&redirect_uri=http://localhost:8080/login/oauth2/code/keycloak&nonce=S6xGCibWzO5FmTEoqvoCaJuqMs3cbYQX2huh1YLJMDk&code_challenge=j2uR-4w4sldLtbd6V8zSJq9Ru7K8YvahybY85l7y89k&code_challenge_method=S256


    servlet:
      multipart:
        max-file-size: 10MB # max allocation for single file size
        max-request-size: 30MB # ... for the whole request
  #    security:
#      user:
#        name: developer
#        password: pass12345
    application:
      name: product-api-simple-demo
# jpa, postgres
    datasource:
      url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: update    # create | update | none
      show-sql: true          # log generated SQL
      properties:
        hibernate:
          format_sql: true
server:
  port: 8080
